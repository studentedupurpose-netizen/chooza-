services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ccx
      POSTGRES_PASSWORD: ccx_dev_password
      POSTGRES_DB: choozacoinx
    ports: ["5432:5432"]
    volumes: ["ccx_pg:/var/lib/postgresql/data","./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ccx -d choozacoinx"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ccx_pg:
